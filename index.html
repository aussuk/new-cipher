<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="Cipher_Logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Cipher Encryptor</title>
  <style>
    /* launcher button and panel drawer */
    .launcherBtn {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 1200;
      background: #2b6cb0;
      color: #fff;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .panelDrawer {
      position: fixed;
      left: 12px;
      top: 48px;
      width: 520px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 72px);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.25);
      overflow: hidden;
      z-index: 1199;
      display: none;
      flex-direction: column;
    }
    .panelDrawer.show {
      display: flex;
    }
    .panelHeader {
      display:flex;
      align-items:center;
      gap:8px;
      background:#f1f7ff;
      padding:8px 10px;
      border-bottom:1px solid #e6eefc;
    }
    .tabBtn {
      background:transparent;
      border: none;
      padding:6px 10px;
      cursor:pointer;
      border-radius:4px;
      font-weight:600;
    }
    .tabBtn.active { background:#dceffb; }
    .panelClose {
      margin-left:auto;
      background:transparent;
      border: none;
      cursor:pointer;
      font-size:1.0em;
      padding:6px;
    }
    .panelContent {
      padding:10px;
      overflow:auto;
      max-height:calc(100% - 48px);
      background: #fff;
    }
    /* small responsiveness */
    @media (max-width:600px) {
      .panelDrawer { left:8px; top:56px; width: calc(100vw - 16px); }
    }

    body {
      font-family: Arial, sans-serif;
      margin: 5vw;
      background: #f7f7fa;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 6vw;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0001;
    }
    label {
      display: block;
      margin-top: 4vw;
      font-size: 1.1em;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 2vw;
      margin-top: 1vw;
      font-size: 1.1em;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 6px;
      resize: vertical;
      background: #fafafa;
      font-family: 'Inter', 'Poppins', 'Segoe UI', 'Roboto', sans-serif;
    }
    textarea { min-height: 80px; }
    .row { display:flex; align-items:center; gap:10px; margin-top:1.2em; flex-wrap:wrap; }
    button {
      margin-top: 1vw;
      padding: 0.9rem 1.1rem;
      font-size: 1rem;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button.secondary { background: #e24a4a; }
    button.ghost {
      background: #444;
      color: #fff;
      border: 1px solid #333;
      padding: 0.7rem 0.9rem;
    }
    .output {
      margin-top: 5vw;
      font-size: 1.2em;
      color: #333;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .statusBar {
      margin-top: 1vw;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95em;
      color: #555;
    }
    .statusBar div {
      min-width: 140px;
    }
    .secret-overlay {
      position: fixed;
      inset: 0;
      z-index: 1300;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      padding: 16px;
    }
    .secret-overlay.hidden {
      display: none;
    }
    .secret-card {
      width: min(460px, 100%);
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .secret-card h3 {
      margin: 0 0 8px;
    }
    .secret-card p {
      margin: 0 0 14px;
      color: #33415b;
    }
    .secret-btn {
      min-width: 80px;
      border-radius: 10px;
      border: none;
      padding: 0.9rem 1rem;
      font-size: 0.98rem;
      cursor: pointer;
      background: #4a90e2;
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .secret-btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }
    .secret-btn.secondary {
      background: #444;
    }
    .secret-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .note { font-size:0.9em; color:#666; margin-top:6px; }
    @media (max-width: 500px) {
      .container {
        max-width: 98vw;
        padding: 4vw;
      }
      body {
        margin: 2vw;
      }
      label, input[type="text"], button, .output {
        font-size: 1em;
      }
    }
    button:active {
      transform: scale(0.97);
      box-shadow: 0 0 15px rgba(0, 140, 255, 0.4);
      transition: all 0.15s ease;
    }
    button {
      transition: all 0.15s ease;
    }
    .secret-card canvas {
      width: 100%;
      height: auto;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: #111;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .mobile-snake-controls {
      display: none !important;
    }
    /* Achievements Pop-up Toast */
    .achievement-toast {
      position: fixed;
      top: -100px; /* Start hidden off-screen */
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
      color: #fff;
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3), 0 0 12px rgba(214, 158, 46, 0.4);
      border: 2px solid #d69e2e; /* Gold border */
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .achievement-toast.show {
      top: 20px; /* Glides down into view */
    }
    .achievement-toast .icon {
      font-size: 24px;
      animation: trophy-bounce 1s infinite alternate;
    }
    .achievement-toast .text-content h4 {
      margin: 0;
      color: #ecc94b; /* Bright Gold */
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .achievement-toast .text-content p {
      margin: 2px 0 0 0;
      font-size: 13px;
      color: #e2e8f0;
    }
    @keyframes trophy-bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Custom Cipher Encryptor</h2>

    <label for="wordInput">Text to Encrypt / Decrypt:</label>
    <textarea id="wordInput"></textarea>
    <div class="note">Press Shift+Enter to encrypt automatically while in the text box.</div>

    <label for="keyInput">Key (numbers or letters)</label>
    <input type="text" id="keyInput">
    <div id="statusBar" class="statusBar">
      <div id="charMetrics">Chars: 0 | Movable: 0</div>
      <div id="entropyRating">Entropy: N/A</div>
    </div>

    <div class="row">
      <button id="encryptBtn">Encrypt</button>
      <button id="decryptBtn" class="secondary">Decrypt</button>
      <button id="reverseBtn" class="ghost">Reverse</button>
      <button id="randomKeyBtn" class="ghost">Random Key</button>
      <button id="copyBtn" class="ghost">Copy Output</button>
      <button id="settingsBtn" class="ghost">Settings</button>
    </div>

    <div class="output" id="output"></div>
  </div>

  <div class="mobile-snake-controls" id="mobileSnakeControls">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="down" data-dir="down">↓</button>
    <button class="right" data-dir="right">→</button>
  </div>

  <div id="secretOverlay" class="secret-overlay hidden">
    <div class="secret-card">
      <h3>Snake mode Activated!</h3>
      <p>Play a quick Snake mini-game. Use the arrow keys or swipe to move.</p>
      <canvas id="snakeCanvas" width="360" height="360" style="background:#111; border-radius:12px; display:block; margin: 0 auto;"></canvas>
      <div id="secretMessage" style="margin-top:12px; font-weight:700; color:#222;">Score: 0</div>
      <div style="margin-top: 18px;">
        <button id="secretCloseBtn" class="secret-btn secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="settingsPanel" class="panelDrawer" role="dialog" aria-modal="true">
    <div class="panelHeader">
      <span>Settings</span>
      <button id="settingsCloseBtn" class="panelClose">✕</button>
    </div>
    <div class="panelContent">
      <label style="display:flex; align-items:center; gap:10px; margin-bottom: 14px;">
        <input type="checkbox" id="caseSensitiveReversion" checked>
        Enable case-sensitive reversion
      </label>
      <label style="display:flex; align-items:center; gap:10px; margin-bottom: 14px;">
        <input type="checkbox" id="liveEncrypt">
        Live Encrypt
      </label>
      <div style="font-weight:600; margin-bottom: 8px;">Reverse mode</div>
      <label style="display:block; margin-bottom: 12px;">
        <input type="radio" name="reverseMode" value="deep" checked> Deep Search
        <div style="color:#666; margin-left: 22px; font-size:0.95em;">For small amounts of text. Slower, but generates a simple key.</div>
      </label>
      <label style="display:block; margin-bottom: 12px;">
        <input type="radio" name="reverseMode" value="quick"> Direct Mapping
        <div style="color:#666; margin-left: 22px; font-size:0.95em;">Very fast, but generates a key depending on the input text.</div>
      </label>
    </div>
  </div>

  <script>
    // helper: is letter
    function isLetter(ch) {
      return /^[A-Za-z]$/.test(ch);
    }

    // helper: vowel test
    function isVowel(ch) {
      return /[AEIOUaeiou]/.test(ch);
    }

    // evaluate a condition object against a character and optional index (1-based position among movable chars)
    function evaluateSingleCondition(cond, ch, idx) {
      if (!cond) return true;

      // index-based conditions (kind === 'index')
      if (cond.kind === 'index') {
        const i = Number.isFinite(idx) ? idx + 1 : 1;
        let ok = true;

        if (cond.mod != null && cond.op && cond.rhs != null) {
          const val = i % cond.mod;
          ok = (cond.op === '!=') ? (val !== cond.rhs) : (val === cond.rhs);
        } else if (cond.parity) {
          ok = cond.parity === 'even' ? (i % 2 === 0) : (i % 2 !== 0);
        } else if (cond.indices) {
          ok = cond.indices.includes(i);
        } else if (cond.range) {
          ok = i >= cond.range[0] && i <= cond.range[1];
        } else if (cond.op && cond.rhs != null) {
          if (cond.op === '>') ok = i > cond.rhs;
          else if (cond.op === '>=') ok = i >= cond.rhs;
          else if (cond.op === '<') ok = i < cond.rhs;
          else if (cond.op === '<=') ok = i <= cond.rhs;
          else if (cond.op === '==' ) ok = i === cond.rhs;
          else if (cond.op === '!=') ok = i !== cond.rhs;
          else ok = false;
        }

        return cond.negate ? !ok : ok;
      }

      if (!ch) return false;
      const upper = String(ch).toUpperCase();
      if (cond.kind === 'vowel') {
        const res = isVowel(upper);
        return cond.negate ? !res : res;
      } else if (cond.kind === 'consonant') {
        const res = isLetter(upper) && !isVowel(upper);
        return cond.negate ? !res : res;
      } else if (cond.kind === 'equals') {
        if (cond.letters && cond.letters.has(upper)) return cond.negate ? false : true;
        if (cond.ranges) {
          for (const [a,b] of cond.ranges) {
            if (upper >= a && upper <= b) return cond.negate ? false : true;
          }
        }
        return cond.negate ? true : false;
      }
      return true;
    }

    function evaluateCondition(cond, ch, idx) {
      if (!cond) return true;
      const conditions = Array.isArray(cond) ? cond : [cond];
      for (const condition of conditions) {
        if (!evaluateSingleCondition(condition, ch, idx)) return false;
      }
      return true;
    }

    // Replace the current letterToNumber with this safe version
    function letterToNumber(letter) {
      const ch = String(letter || '');
      return /[a-zA-Z]/.test(ch) ? ch.toUpperCase().charCodeAt(0) - 64 : 0;
    }

    // punctuation test with unicode fallback
    function isPunctuation(ch) {
      if (!ch) return false;
      return /[!"#\$%&'\(\)\*\+,\-\.\/:;<=>\?@\[\\\]\^_`{\|}~]/.test(ch)
        || /[\u2000-\u206F\u2E00-\u2E7F]/.test(ch);
    }

    // Build array of indices that are allowed to be moved (respect flags)
    function getMovableIndices(text, flags) {
      flags = flags || {};
      const idx = [];
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (flags.ignorePara && (ch === '\n' || ch === '\r')) continue;
        if (flags.ignoreSpaces && /\s/.test(ch)) continue;
        if (flags.ignorePunct && isPunctuation(ch)) continue;
        idx.push(i);
      }
      return idx;
    }

    // Detailed key parser:
    // supports flags (_ : ¶), repeat suffix #N (clamped 1..5),
    // digits, parentheses for multi-digit numbers, letters -> 1..26,
    // and conditional tokens that attach to the next shift:
    //   ?v, ?c, ?=a,b, ?=a-c, ?i(n), ?i(n,m), ?i(n-m), ?i(>n), ?i(<=n), ?i(%n)
    //   and negated versions !v, !c, !=a,b, !=a-c, !i(>n)
    // Returns { numbers[], ops:[{shift,cond|null}], flags:{...}, repeat }
    function parseKeyDetailed(rawKey) {
      const flags = { ignoreSpaces: false, ignorePunct: false, ignorePara: false };
      if (!rawKey) return { numbers: [], ops: [], flags, repeat: 1 };

      // detect extender '-' at end (repeat last part forever)
      let extender = false;
      let keyWorking = String(rawKey || '');
      if (keyWorking.endsWith('-')) {
        extender = true;
        keyWorking = keyWorking.replace(/-$/, '');
      }

      // detect repeat suffix like #2, #03, clamp 1..5
      let repeat = 1;
      const rmatch = keyWorking.match(/#(\d+)/);
      if (rmatch) repeat = Math.max(1, Math.min(5, Number(rmatch[1]) || 1));

      // remove repeat tokens
      const keyNoRepeat = keyWorking.replace(/#\d+/g, '');

      if (keyNoRepeat.includes('_')) flags.ignoreSpaces = true;
      if (keyNoRepeat.includes(':')) flags.ignorePunct = true;
      if (keyNoRepeat.includes('¶')) flags.ignorePara = true;

      // strip flags for parsing rest
      const key = keyNoRepeat.replace(/[_:¶]/g, '');

      const numbers = [];
      const ops = [];
      const pendingConds = [];

      function pushShift(val) {
        numbers.push(val);
        ops.push({ shift: val, cond: pendingConds.length ? pendingConds.slice() : null });
        pendingConds.length = 0;
      }

      function condEquals(a, b) {
        if (a === b) return true;
        if (!a || !b) return false;
        if (a.kind !== b.kind) return false;
        if (!!a.negate !== !!b.negate) return false;
        if ((a.rhs || 0) !== (b.rhs || 0)) return false;
        if ((a.op || null) !== (b.op || null)) return false;
        if ((a.mod || null) !== (b.mod || null)) return false;
        if ((a.parity || null) !== (b.parity || null)) return false;
        if (a.range || b.range) {
          if (!a.range || !b.range) return false;
          if (a.range[0] !== b.range[0] || a.range[1] !== b.range[1]) return false;
        }
        if (a.indices || b.indices) {
          if (!a.indices || !b.indices) return false;
          if (a.indices.length !== b.indices.length) return false;
          for (let i = 0; i < a.indices.length; i++) if (a.indices[i] !== b.indices[i]) return false;
        }
        if (a.letters || b.letters) {
          if (!a.letters || !b.letters) return false;
          const A = Array.from(a.letters).sort();
          const B = Array.from(b.letters).sort();
          if (A.length !== B.length) return false;
          for (let i = 0; i < A.length; i++) if (A[i] !== B[i]) return false;
        }
        if (a.ranges || b.ranges) {
          if (!a.ranges || !b.ranges) return false;
          if (a.ranges.length !== b.ranges.length) return false;
          for (let i = 0; i < a.ranges.length; i++) {
            if (a.ranges[i][0] !== b.ranges[i][0] || a.ranges[i][1] !== b.ranges[i][1]) return false;
          }
        }
        return true;
      }

      function opEquals(x, y) {
        if (!x || !y) return x === y;
        if (x.shift !== y.shift) return false;
        return condEquals(x.cond, y.cond);
      }

      for (let i = 0; i < key.length; i++) {
        const ch = key[i];
        if (ch === '?' || ch === '!') {
          const neg = ch === '!';
          const next = key[i + 1] || '';

          // list / ranges after '='  (e.g. ?=a,b or ?=a-c)
          if (next === '=') {
            i += 2;
            let list = '';
            while (i < key.length && /[A-Za-z\-,\[\]]/.test(key[i])) { list += key[i++]; }
            i--;
            const items = list.split(',').map(s => s.trim()).filter(Boolean);
            const letters = new Set();
            const ranges = [];
            for (let it of items) {
              it = it.replace(/^\[|\]$/g, '').trim();
              const m = it.match(/^([A-Za-z])\-([A-Za-z])$/);
              if (m) {
                const a = m[1].toUpperCase();
                const b = m[2].toUpperCase();
                ranges.push([a < b ? a : b, a < b ? b : a]);
              } else if (/^[A-Za-z]$/.test(it)) {
                letters.add(it.toUpperCase());
              }
            }
            pendingConds.push({ kind: 'equals', negate: neg, letters: letters.size ? letters : null, ranges: ranges.length ? ranges : null });
            continue;
          }

          if (next === '(') {
            let j = i + 1;
            let payload = '';
            while (j < key.length && key[j] !== ')') { payload += key[j++]; }
            if (key[j] === ')') {
              i = j;
              payload = payload.trim();
              if (/^[0-9]+-[0-9]+$/.test(payload)) {
                const parts = payload.split('-').map(Number);
                pendingConds.push({ kind: 'index', negate: neg, range: [Math.min(parts[0], parts[1]), Math.max(parts[0], parts[1])] });
                continue;
              }
              const values = payload.split(',').map(v => Number(v.trim())).filter(Number.isFinite);
              if (values.length > 0) {
                pendingConds.push({ kind: 'index', negate: neg, indices: values });
                continue;
              }
            }
          }

          // vowel / consonant: ?V ?C (case-insensitive)
          if (/^[VCvc]$/.test(next)) {
            const kind = (next.toUpperCase() === 'V') ? 'vowel' : 'consonant';
            pendingConds.push({ kind, negate: neg });
            i++; // consumed next char
            continue;
          }

          // position/index-based conditions starting with 'i'
          if (next && next.toLowerCase() === 'i') {
            let j = i + 2; // points at the first char after 'i'
            let expr = 'i';

            // direct parity shorthand: ie/io
            if (j < key.length && /^[eo]$/i.test(key[j])) {
              expr += key[j++];
              i = j - 1;

              const parityMatch = expr.match(/^i([eo])$/i);
              if (parityMatch) {
                pendingConds.push({
                  kind: 'index',
                  negate: neg,
                  parity: parityMatch[1].toLowerCase() === 'e' ? 'even' : 'odd'
                });
                continue;
              }
            } else if (j < key.length && key[j] === '(') {
              expr += key[j++];
              while (j < key.length && key[j] !== ')') {
                expr += key[j++];
              }
              if (j < key.length && key[j] === ')') {
                expr += key[j++];
                i = j - 1;
              } else {
                pendingConds.length = 0;
                continue;
              }
            } else {
              pendingConds.length = 0;
              continue;
            }

            // direct index list/range or comparator inside parentheses: i(n), i(n,m), i(n-m), i(>n), i(>=n), i(<n), i(<=n), i(=n), i(%n)
            const listRangeMatch = expr.match(/^i\(([^)]+)\)$/);
            if (listRangeMatch) {
              const payload = listRangeMatch[1].trim();

              if (/^%\d+$/.test(payload)) {
                pendingConds.push({
                  kind: 'index',
                  negate: neg,
                  mod: Number(payload.slice(1)),
                  op: '==',
                  rhs: 0
                });
                continue;
              }

              const compMatch = payload.match(/^(>=|<=|>|<|==|=)([0-9]+)$/);
              if (compMatch) {
                let op = compMatch[1] === '=' ? '==' : compMatch[1];
                pendingConds.push({ kind: 'index', negate: neg, op: op, rhs: Number(compMatch[2]) });
                continue;
              }

              if (/^[0-9]+-[0-9]+$/.test(payload)) {
                const parts = payload.split('-').map(Number);
                pendingConds.push({ kind: 'index', negate: neg, range: [Math.min(parts[0], parts[1]), Math.max(parts[0], parts[1])] });
                continue;
              }

              const values = payload.split(',').map(v => Number(v.trim())).filter(Number.isFinite);
              if (values.length > 0) {
                pendingConds.push({ kind: 'index', negate: neg, indices: values });
                continue;
              }
            }

            // unrecognized or deprecated index expression -> ignore pending
            pendingConds.length = 0;
            continue;
          }

          // unknown pattern -> ignore pending
          pendingConds.length = 0;
          continue;
        }

        // multi-digit number in parentheses, possibly negative (e.g. (12) or (-3))
        if (ch === '(') {
          let j = i + 1;
          let neg = false;
          if (key[j] === '-') { neg = true; j++; }
          let numStr = '';
          while (j < key.length && /\d/.test(key[j])) numStr += key[j++];
          const val = numStr.length ? (Number(numStr) * (neg ? -1 : 1)) : 0;
          pushShift(val);
          i = (j < key.length && key[j] === ')') ? j : j - 1;
          continue;
        }

        // single digit shift
        if (/\d/.test(ch)) {
          pushShift(Number(ch));
          continue;
        }

        // letter -> A=1 .. Z=26
        if (/[a-zA-Z]/.test(ch)) {
          pushShift(letterToNumber(ch));
          continue;
        }
      }

      // compress fully-repeated patterns (e.g. 262626 -> 26)
      return { numbers, ops, flags, repeat, extender };
    }

    function splitKeyFlagsSuffix(key) {
      const match = String(key).match(/^([\s\S]*?)([_:¶]*)$/);
      return { base: match ? match[1] : '', flags: match ? match[2] : '' };
    }

    function compressReversedKey(key) {
      const { base, flags } = splitKeyFlagsSuffix(key);
      if (!base) return key;
      for (let k = 1; k <= base.length / 2; k++) {
        if (base.length % k !== 0) continue;
        const part = base.slice(0, k);
        if (part.repeat(base.length / k) === base) {
          return part + flags;
        }
      }
      return key;
    }

    function applyQuickExtenderIfRepeatedTail(key) {
      const { base, flags } = splitKeyFlagsSuffix(key);
      if (base.length < 3) return key;
      let i = base.length - 1;
      while (i > 0 && base[i] === base[i - 1]) i--;
      const repeatCount = base.length - i;
      if (repeatCount >= 3) {
        return base.slice(0, i + 1) + '-' + flags;
      }
      return key;
    }

    function formatReverseShift(shift) {
      if (typeof shift !== 'number' || Number.isNaN(shift)) return String(shift);
      if (shift < 0) {
        const abs = Math.abs(shift);
        if (abs <= 9) return String(shift);
        return `(${shift})`;
      }
      if (shift <= 9) return String(shift);
      if (shift <= 26) return String.fromCharCode(64 + shift);
      return `(${shift})`;
    }

    function normalizeReversedKey(key, isQuick) {
      let result = compressReversedKey(key);
      return isQuick ? applyQuickExtenderIfRepeatedTail(result) : result;
    }

    // Encryption: apply the swaps in forward order (supports rounds and conditionals)
    function encrypt(word, rawKey) {
      const parsed = parseKeyDetailed(rawKey);
      const ops = (parsed.ops && parsed.ops.length) ? parsed.ops : parsed.numbers.map(s => ({ shift: s, cond: null }));
      const flags = parsed.flags;
      const rounds = Math.max(1, Math.min(5, parsed.repeat || 1));
      if (!ops || ops.length === 0) return word;

      let chars = word.split('');
      for (let r = 0; r < rounds; r++) {
        const movable = getMovableIndices(chars.join(''), flags);
        const m = movable.length;
        if (m === 0) break;

        const baseLen = ops.length || 1;
        const finiteLen = baseLen * rounds;
        function getOpFor(rnd, i, linearIdx) {
          if (!parsed.extender) return ops[i % ops.length];
          if (linearIdx < finiteLen) return ops[linearIdx % baseLen];
          return ops[baseLen - 1];
        }

        for (let i = 0; i < m; i++) {
          const linearIdx = r * m + i;
          const op = getOpFor(r, i, linearIdx);
          const shift = op.shift || 0;
          const shiftMod = ((shift % m) + m) % m;
          const swapPos = (i + shiftMod) % m;
          const idxA = movable[i];
          const idxB = movable[swapPos];
          const curLetter = chars[idxA];
          // pass movable-position index 'i' to evaluator for position-based conditionals
          if (!evaluateCondition(op.cond, curLetter, i)) continue;
          [chars[idxA], chars[idxB]] = [chars[idxB], chars[idxA]];
        }
      }
      return chars.join('');
    }

    // Decryption: reverse the process by iterating movable positions in reverse order
    function decrypt(word, rawKey) {
      const parsed = parseKeyDetailed(rawKey);
      const ops = (parsed.ops && parsed.ops.length) ? parsed.ops : parsed.numbers.map(s => ({ shift: s, cond: null }));
      const flags = parsed.flags;
      const rounds = Math.max(1, Math.min(5, parsed.repeat || 1));
      if (!ops || ops.length === 0) return word;

      let chars = word.split('');
      for (let r = 0; r < rounds; r++) {
        const movable = getMovableIndices(chars.join(''), flags);
        const m = movable.length;
        if (m === 0) break;

        const baseLen = ops.length || 1;
        const finiteLen = baseLen * rounds;
        function getOpFor(rnd, i, linearIdx) {
          if (!parsed.extender) return ops[i % ops.length];
          if (linearIdx < finiteLen) return ops[linearIdx % baseLen];
          return ops[baseLen - 1];
        }

        for (let i = m - 1; i >= 0; i--) {
          const linearIdx = r * m + i;
          const op = getOpFor(r, i, linearIdx);
          const shift = op.shift || 0;
          const shiftMod = ((shift % m) + m) % m;
          const swapPos = (i + shiftMod) % m;
          const idxA = movable[i];
          const idxB = movable[swapPos];
          const curLetter = chars[idxA];
          // pass movable-position index 'i' to evaluator for position-based conditionals
          if (!evaluateCondition(op.cond, curLetter, i)) continue;
          [chars[idxA], chars[idxB]] = [chars[idxB], chars[idxA]];
        }
      }
      return chars.join('');
    }

    // update UI result functions to show rounds info
    function doEncrypt() {
      const word = document.getElementById('wordInput').value;
      const key = document.getElementById('keyInput').value;
      checkKeyAchievements(key);
      const secretSequence = '↑↑↓↓←→←→';
      if (isMobileDevice() && word.trim() === secretSequence && !key.trim()) {
        if (!snakeOverlayOpen) showSecretOverlay();
        return;
      }
      const parsed = parseKeyDetailed(key);
      const result = encrypt(word, key);
      const rounds = parsed.repeat && parsed.repeat > 1 ? ` (${parsed.repeat} Rounds)` : '';
      document.getElementById('output').textContent = result ? `Encrypted${rounds}: ${result}` : '';
      updateMetrics();
    }

    function doDecrypt() {
      const word = document.getElementById('wordInput').value;
      const key = document.getElementById('keyInput').value;
      checkKeyAchievements(key);
      const parsed = parseKeyDetailed(key);
      const result = decrypt(word, key);
      const rounds = parsed.repeat && parsed.repeat > 1 ? ` (${parsed.repeat} Rounds)` : '';
      document.getElementById('output').textContent = result ? `Decrypted${rounds}: ${result}` : '';
      updateMetrics();
    }

    document.getElementById('encryptBtn').onclick = doEncrypt;
    document.getElementById('decryptBtn').onclick = doDecrypt;

    const konamiPattern = ['up','up','down','down','left','right','left','right'];
    let konamiProgress = 0;
    let snakeOverlayOpen = false;
    let snakeInterval = null;
    let snakeCanvas = null;
    let snakeCtx = null;
    let snakeGridSize = 18;
    let snakeCellSize = 20;
    let snakeBody = [];
    let snakeDirection = 'right';
    let snakeNextDirection = 'right';
    let snakeFood = null;
    let snakeScore = 0;
    let snakeRunning = false;
    let snakePointerActive = false;
    let snakePointerId = null;
    let snakePointerStart = null;
    let snakeGestureSetup = false;

    const SETTINGS_KEY = 'newCipherSettingsV1';
    const settings = {
      caseSensitiveReversion: true,
      reverseMode: 'deep',
      liveEncrypt: false
    };

    const ACHIEVEMENTS_KEY = 'new_cipher_achievements';

    // Default achievement definitions
    let achievements = {
      cryptanalyst: { name: "The Cryptanalyst", desc: "Successfully reversed a custom key!", unlocked: false },
      bigBrain: { name: "Big Brain Logic", desc: "Used a conditional flag (? or !) in your key!", unlocked: false },
      infinity: { name: "To Infinity... and beyond!", desc: "Activated the infinite extender (-) flag!", unlocked: false },
      snakeUnlocked: { name: "Sssssuccess", desc: "Discovered the hidden Snake mini-game!", unlocked: false },
      snakeMaster: { name: "Snake Master", desc: "Scored 20 points in the mini-game!", unlocked: false },
      totalChaos: {name: "Total Chaos", desc: "Encrypted a key with 100% Entropy!", unlocked: false },
      doomedSociety: {name: "Doomed Society",desc: "Total brainrot.", unlocked: false},
      touchSomeGrass: {name: "Touch Some Grass", desc: "Encrypted 100 times!", unlocked: false}
    };

    function loadSettings() {
      try {
        const saved = window.localStorage.getItem(SETTINGS_KEY);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        
        if (typeof parsed.caseSensitiveReversion === 'boolean') {
          settings.caseSensitiveReversion = parsed.caseSensitiveReversion;
          document.getElementById('caseSensitiveReversion').checked = parsed.caseSensitiveReversion;
        }
        if (typeof parsed.liveEncrypt === 'boolean') {
          settings.liveEncrypt = parsed.liveEncrypt;
          document.getElementById('liveEncrypt').checked = parsed.liveEncrypt;
        }
        if (parsed.reverseMode === 'deep' || parsed.reverseMode === 'quick') {
          settings.reverseMode = parsed.reverseMode;
          const selected = document.querySelector(`input[name="reverseMode"][value="${parsed.reverseMode}"]`);
          if (selected) selected.checked = true;
        }
      } catch (err) {
        console.warn('Failed to load settings:', err);
      }
    }

    // Load achievements from localStorage on boot
    function loadAchievements() {
      try {
        const saved = localStorage.getItem(ACHIEVEMENTS_KEY);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        // Sync values into our operational object
        for (let key in parsed) {
          if (achievements[key]) {
            achievements[key].unlocked = parsed[key].unlocked;
          }
        }
      } catch (err) {
        console.warn('Failed to load achievements:', err);
      }
    }

    function checkKeyAchievements(rawKey) {
      const parsed = parseKeyDetailed(rawKey || '');
      if (/[?!]/.test(rawKey || '')) {
        unlockAchievement('bigBrain');
      }
      if (parsed.extender) {
        unlockAchievement('infinity');
      }
      const clean = (rawKey || '').toLowerCase().trim();
      if (clean === '67' || clean === 'sixseven') {
        unlockAchievement('doomedSociety');
      }
    }

    // Trigger an unlock check
    function unlockAchievement(id) {
      if (achievements[id] && !achievements[id].unlocked) {
        achievements[id].unlocked = true;
        
        // Save state immediately
        localStorage.setItem(ACHIEVEMENTS_KEY, JSON.stringify(achievements));
        
        // Throw the top screen animation popup
        showAchievementToast(achievements[id].name, achievements[id].desc);
      }
    }

    // Creates and animates the toast container at the top of the viewport
    function showAchievementToast(title, description) {
      // Remove an old toast if one is still lingering
      const oldToast = document.querySelector('.achievement-toast');
      if (oldToast) oldToast.remove();

      // Build the structure
      const toast = document.createElement('div');
      toast.className = 'achievement-toast';
      toast.innerHTML = `
        <div class="icon">🏆</div>
        <div class="text-content">
          <h4>Achievement Unlocked!</h4>
          <p><strong>${title}</strong> - ${description}</p>
        </div>
      `;
      document.body.appendChild(toast);

      // Trigger transition via macro-task delay
      setTimeout(() => toast.classList.add('show'), 50);

      // Slide back up and delete after 4 seconds
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 600);
      }, 4000);
    }

    function saveSettings() {
      try {
        const payload = {
          caseSensitiveReversion: settings.caseSensitiveReversion,
          reverseMode: settings.reverseMode,
          liveEncrypt: settings.liveEncrypt
        };
        window.localStorage.setItem(SETTINGS_KEY, JSON.stringify(payload));
      } catch (err) {
        console.warn('Failed to save settings:', err);
      }
    }

    function getOutputText() {
      const out = document.getElementById('output').textContent || '';
      return out.replace(/^(Encrypted|Decrypted)(?:\s*\([^)]*\))?:\s*/, '');
    }

    function updateMetrics() {
      const word = document.getElementById('wordInput').value || '';
      const key = document.getElementById('keyInput').value || '';
      const outputText = getOutputText();
      const parsed = parseKeyDetailed(key);
      const movable = getMovableIndices(word, parsed.flags);
      const total = word.length;
      const movableCount = movable.length;
      document.getElementById('charMetrics').textContent = `Chars: ${total} | Movable: ${movableCount}`;

      let entropyLabel = 'Entropy: N/A';
      if (movableCount > 0) {
        if (outputText) {
          let changed = 0;
          for (const idx of movable) {
            if (outputText[idx] !== word[idx]) changed += 1;
          }
          const percent = Math.round((changed / movableCount) * 100);
          const rating = percent < 30 ? 'Low' : percent < 70 ? 'Medium' : 'High';
          entropyLabel = `Entropy: ${percent}% (${rating})`;
        } else {
          entropyLabel = 'Entropy: 0% (None)';
        }
      }
      document.getElementById('entropyRating').textContent = entropyLabel;
    }

    function handleLiveInputUpdate() {
      updateMetrics();
      if (settings.liveEncrypt) {
        doEncrypt();
      }
    }

    function isMobileDevice() {
      return /Mobi|Android|iPhone|iPad|iPod|Windows Phone|webOS|BlackBerry|Opera Mini/i.test(navigator.userAgent)
        || (navigator.maxTouchPoints > 0 && !/Macintosh|Windows NT|Linux/.test(navigator.userAgent));
    }

    function openSettingsPanel() {
      document.getElementById('settingsPanel').classList.add('show');
    }

    function closeSettingsPanel() {
      document.getElementById('settingsPanel').classList.remove('show');
    }

    function syncSettingsFromUi() {
      settings.caseSensitiveReversion = document.getElementById('caseSensitiveReversion').checked;
      settings.liveEncrypt = document.getElementById('liveEncrypt').checked;
      const selected = document.querySelector('input[name="reverseMode"]:checked');
      if (selected) settings.reverseMode = selected.value;
      updateMetrics();
      saveSettings();
      if (settings.liveEncrypt) {
        doEncrypt();
      }
    }

    function onSnakeResize() {
      if (snakeOverlayOpen) resizeSnakeCanvas();
    }

    function showSecretOverlay() {
      unlockAchievement('snakeUnlocked');
      const overlay = document.getElementById('secretOverlay');
      const message = document.getElementById('secretMessage');
      overlay.classList.remove('hidden');
      snakeOverlayOpen = true;
      initSnakeGame();
      if (!snakeGestureSetup) {
        setupSnakeGestureControls();
        snakeGestureSetup = true;
      }
      window.addEventListener('resize', onSnakeResize);
      message.textContent = 'Score: 0';
    }

    function hideSecretOverlay() {
      stopSnakeGame();
      document.getElementById('secretOverlay').classList.add('hidden');
      snakeOverlayOpen = false;
      window.removeEventListener('resize', onSnakeResize);
    }

    function initSnakeGame() {
      snakeCanvas = document.getElementById('snakeCanvas');
      snakeCtx = snakeCanvas.getContext('2d');
      snakeBody = [
        { x: 8, y: 9 },
        { x: 7, y: 9 },
        { x: 6, y: 9 }
      ];
      snakeDirection = 'right';
      snakeNextDirection = 'right';
      snakeScore = 0;
      snakeRunning = true;
      placeSnakeFood();
      resizeSnakeCanvas();
      drawSnakeGame();
      if (snakeInterval) clearInterval(snakeInterval);
      snakeInterval = setInterval(tickSnakeGame, 140);
    }

    function resizeSnakeCanvas() {
      if (!snakeCanvas) return;
      const rect = snakeCanvas.getBoundingClientRect();
      const size = Math.min(rect.width, window.innerHeight * 0.72, 420);
      const dpr = window.devicePixelRatio || 1;
      snakeCanvas.style.width = `${size}px`;
      snakeCanvas.style.height = `${size}px`;
      snakeCanvas.width = Math.floor(size * dpr);
      snakeCanvas.height = Math.floor(size * dpr);
      snakeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      snakeCellSize = size / snakeGridSize;
    }

    function setupSnakeGestureControls() {
      if (!snakeCanvas) return;
      snakeCanvas.addEventListener('pointerdown', (e) => {
        snakePointerActive = true;
        snakePointerId = e.pointerId;
        snakePointerStart = { x: e.clientX, y: e.clientY };
        snakeCanvas.setPointerCapture(e.pointerId);
      });
      snakeCanvas.addEventListener('pointerup', (e) => {
        if (!snakePointerActive || e.pointerId !== snakePointerId || !snakePointerStart) return;
        const dx = e.clientX - snakePointerStart.x;
        const dy = e.clientY - snakePointerStart.y;
        snakePointerActive = false;
        snakePointerId = null;
        snakePointerStart = null;
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        if (dist < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          handleSnakeDirection(dx > 0 ? 'right' : 'left');
        } else {
          handleSnakeDirection(dy > 0 ? 'down' : 'up');
        }
      });
      snakeCanvas.addEventListener('pointercancel', () => {
        snakePointerActive = false;
        snakePointerId = null;
        snakePointerStart = null;
      });
    }

    function stopSnakeGame() {
      snakeRunning = false;
      if (snakeInterval) {
        clearInterval(snakeInterval);
        snakeInterval = null;
      }
    }

    function placeSnakeFood() {
      const occupied = new Set(snakeBody.map(p => `${p.x},${p.y}`));
      let x, y;
      do {
        x = Math.floor(Math.random() * snakeGridSize);
        y = Math.floor(Math.random() * snakeGridSize);
      } while (occupied.has(`${x},${y}`));
      snakeFood = { x, y };
    }

    function tickSnakeGame() {
      if (snakeScore === 20) {
        unlockAchievement('snakeMaster');
      }
      if (!snakeRunning) return;
      snakeDirection = snakeNextDirection;
      const head = { ...snakeBody[0] };
      if (snakeDirection === 'up') head.y -= 1;
      else if (snakeDirection === 'down') head.y += 1;
      else if (snakeDirection === 'left') head.x -= 1;
      else if (snakeDirection === 'right') head.x += 1;

      if (head.x < 0 || head.x >= snakeGridSize || head.y < 0 || head.y >= snakeGridSize) {
        endSnakeGame();
        return;
      }

      if (snakeBody.some(segment => segment.x === head.x && segment.y === head.y)) {
        endSnakeGame();
        return;
      }

      snakeBody.unshift(head);
      if (head.x === snakeFood.x && head.y === snakeFood.y) {
        snakeScore += 1;
        placeSnakeFood();
      } else {
        snakeBody.pop();
      }
      drawSnakeGame();
      document.getElementById('secretMessage').textContent = `Score: ${snakeScore}`;
    }

    function endSnakeGame() {
      snakeRunning = false;
      if (snakeInterval) {
        clearInterval(snakeInterval);
        snakeInterval = null;
      }
      document.getElementById('secretMessage').textContent = `Game Over — score ${snakeScore}. Close to exit.`;
      drawSnakeGame(true);
    }

    function drawSnakeGame(gameOver = false) {
      snakeCtx.fillStyle = '#111';
      snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
      snakeCtx.strokeStyle = '#222';
      snakeCtx.lineWidth = 2;
      for (let x = 0; x <= snakeGridSize; x += 1) {
        snakeCtx.beginPath();
        snakeCtx.moveTo(x * snakeCellSize, 0);
        snakeCtx.lineTo(x * snakeCellSize, snakeGridSize * snakeCellSize);
        snakeCtx.stroke();
      }
      for (let y = 0; y <= snakeGridSize; y += 1) {
        snakeCtx.beginPath();
        snakeCtx.moveTo(0, y * snakeCellSize);
        snakeCtx.lineTo(snakeGridSize * snakeCellSize, y * snakeCellSize);
        snakeCtx.stroke();
      }
      snakeCtx.fillStyle = '#ff3b3b';
      snakeCtx.fillRect(snakeFood.x * snakeCellSize + 2, snakeFood.y * snakeCellSize + 2, snakeCellSize - 4, snakeCellSize - 4);
      snakeCtx.fillStyle = gameOver ? '#aaa' : '#6ee76e';
      snakeBody.forEach((segment, index) => {
        const inset = index === 0 ? 0 : 3;
        snakeCtx.fillRect(segment.x * snakeCellSize + inset, segment.y * snakeCellSize + inset, snakeCellSize - inset * 2, snakeCellSize - inset * 2);
      });
    }

    function handleSnakeDirection(direction) {
      if (!snakeOverlayOpen || !snakeRunning) return;
      const opposite = {
        up: 'down',
        down: 'up',
        left: 'right',
        right: 'left'
      };
      if (direction === opposite[snakeDirection]) return;
      if (['up','down','left','right'].includes(direction)) {
        snakeNextDirection = direction;
      }
    }

    function registerSecretInput(direction) {
      if (snakeOverlayOpen) return;
      if (direction === konamiPattern[konamiProgress]) {
        konamiProgress += 1;
        if (konamiProgress === konamiPattern.length) {
          showSecretOverlay();
          konamiProgress = 0;
        }
      } else {
        konamiProgress = direction === konamiPattern[0] ? 1 : 0;
      }
    }

    document.addEventListener('keydown', function(e) {
      const arrowDirection = e.key.startsWith('Arrow') ? e.key.replace('Arrow', '').toLowerCase() : null;
      const wasdMap = { w: 'up', a: 'left', s: 'down', d: 'right' };
      const wasdDirection = wasdMap[e.key.toLowerCase()] || null;
      const direction = arrowDirection || wasdDirection;

      if (snakeOverlayOpen && direction) {
        handleSnakeDirection(direction);
        e.preventDefault();
        return;
      }

      if (arrowDirection && !snakeOverlayOpen) {
        registerSecretInput(arrowDirection);
      }
    });

    // Touch swipe detection for Konami activation
    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
      if (snakeOverlayOpen) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, false);

    document.addEventListener('touchend', (e) => {
      if (snakeOverlayOpen) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      const threshold = 50;

      let direction = null;
      if (Math.abs(diffY) > Math.abs(diffX)) {
        direction = diffY < -threshold ? 'up' : diffY > threshold ? 'down' : null;
      } else {
        direction = diffX < -threshold ? 'left' : diffX > threshold ? 'right' : null;
      }

      if (direction) {
        registerSecretInput(direction);
      }
    }, false);

    // Mobile button handlers for snake control
    document.querySelectorAll('.mobile-snake-controls button').forEach(btn => {
      btn.addEventListener('click', function() {
        const direction = this.getAttribute('data-dir');
        handleSnakeDirection(direction);
      });
    });

    document.getElementById('secretCloseBtn').addEventListener('click', hideSecretOverlay);
    document.getElementById('settingsBtn').addEventListener('click', openSettingsPanel);
    document.getElementById('settingsCloseBtn').addEventListener('click', closeSettingsPanel);
    document.getElementById('caseSensitiveReversion').addEventListener('change', syncSettingsFromUi);
    document.querySelectorAll('input[name="reverseMode"]').forEach(input => input.addEventListener('change', syncSettingsFromUi));

    // Enter behavior
    document.getElementById('keyInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doEncrypt();
    });
    document.getElementById('wordInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && e.shiftKey) {
        e.preventDefault();
        doEncrypt();
      }
    });

    // Random Key Generator
    function generateRandomKey(min = 2, max = 15) {
      const baseChars = 'ABCDEFGHJKLMNPQRSTUVWXYZ123456789';
      const len = Math.floor(Math.random() * (max - min + 1)) + min;
      // build base key (shifts as letters/numbers)
      let parts = [];
      for (let i = 0; i < len; i++) parts.push(baseChars[Math.floor(Math.random() * baseChars.length)]);

      // helper to build a conditional token
      function randomConditional() {
        const neg = Math.random() < 0.25; // 25% chance negative
        const prefix = neg ? '!' : '?';

        const kindRoll = Math.random();
        if (kindRoll < 0.18) {
          // vowel/consonant
          return prefix + (Math.random() < 0.5 ? 'V' : 'C');
        } else if (kindRoll < 0.55) {
          // single or multi-letter list like a or a,b,c
          const count = Math.floor(Math.random() * 3) + 1; // 1..3
          const chosen = new Set();
          while (chosen.size < count) {
            const ch = String.fromCharCode(65 + Math.floor(Math.random() * 26));
            chosen.add(ch);
          }
          return prefix + '=' + Array.from(chosen).map(c => c.toLowerCase()).join(',');
        } else {
          // range like a-b
          const a = Math.floor(Math.random() * 26);
          const b = Math.floor(Math.random() * 26);
          const [lo, hi] = a <= b ? [a, b] : [b, a];
          const ra = String.fromCharCode(97 + lo);
          const rb = String.fromCharCode(97 + hi);
          return prefix + '=' + ra + '-' + rb;
        }
      }

      // randomly insert 0..2 conditionals into the parts array (ensure each conditional precedes a shift token)
      const condCount = Math.random() < 0.45 ? (Math.random() < 0.2 ? 2 : 1) : 0; // ~45% chance to add cond(s)
      for (let c = 0; c < condCount; c++) {
        const token = randomConditional();

        // find indices of real shift tokens (letters/digits or paren numbers) to insert BEFORE them
        const candidatePositions = [];
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          if (/^[A-Za-z0-9]$/.test(p) || /^\(\-?\d+\)$/.test(p)) candidatePositions.push(i);
        }

        if (candidatePositions.length === 0) break; // nothing valid to attach to

        const pos = candidatePositions[Math.floor(Math.random() * candidatePositions.length)];
        parts.splice(pos, 0, token);
      }

      let k = parts.join('');

      // small chance to append flags as before
      const r = Math.random();
      if (r < 0.12) k += '_';
      else if (r < 0.24) k += ':';
      else if (r < 0.36) k += '¶';

      return k;
    }

    document.getElementById('randomKeyBtn').addEventListener('click', () => {
      const k = generateRandomKey(2, 15);
      const keyInput = document.getElementById('keyInput');
      keyInput.value = k;
      checkKeyAchievements(k);
      keyInput.focus();
      const prev = keyInput.style.background;
      keyInput.style.background = '#eaffea';
      setTimeout(() => keyInput.style.background = prev, 300);
    });

    // Copy output (copies only the transformed text, without "Encrypted:"/ "Decrypted:")
    async function copyOutput() {
      const out = document.getElementById('output').textContent || '';
      const text = out.replace(/^(Encrypted:|Decrypted:)\s*/, '');
      if (!text) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        const btn = document.getElementById('copyBtn');
        const old = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = old, 1000);
      } catch (err) {
        console.error('Copy failed', err);
      }
    }

    document.getElementById('copyBtn').addEventListener('click', copyOutput);
    
    // Listeners that update settings and save when user changes them
    document.getElementById('liveEncrypt').addEventListener('change', syncSettingsFromUi);
    document.getElementById('caseSensitiveReversion').addEventListener('change', syncSettingsFromUi);
    document.querySelectorAll('input[name="reverseMode"]').forEach(input => {
      input.addEventListener('change', syncSettingsFromUi);
    });
    document.getElementById('wordInput').addEventListener('input', handleLiveInputUpdate);
    document.getElementById('keyInput').addEventListener('input', function() {
      checkKeyAchievements(this.value);
      handleLiveInputUpdate();
    });

    // Boot Up Sequence: Load from storage first, update variables, then draw metrics safely
    loadAchievements();
    loadSettings();
    updateMetrics();
    if (settings.liveEncrypt) {
      doEncrypt();
    }

    function normalizeForReverse(text) {
      return settings.caseSensitiveReversion ? text : String(text).toLowerCase();
    }

    function reverseCharsEqual(a, b) {
      return settings.caseSensitiveReversion ? a === b : String(a).toLowerCase() === String(b).toLowerCase();
    }

    function tryQuickReverse(source, desired, parsedFlags, flagsSuffix) {
      const srcMov = getMovableIndices(source, parsedFlags);
      const tgtMov = getMovableIndices(desired, parsedFlags);
      const m = srcMov.length;
      
      let currentChars = source.split('');
      let finalChars = desired.split('');
      let shifts = [];

      for (let i = 0; i < m; i++) {
        const targetChar = finalChars[srcMov[i]]; // What SHOULD be at this position
        
        // Find where that character is currently located in our working array
        let foundIdx = -1;
        for (let j = i; j < m; j++) {
          if (reverseCharsEqual(currentChars[srcMov[j]], targetChar)) {
            foundIdx = j;
            break;
          }
        }

        if (foundIdx === -1) return null; // Character mismatch

        // Calculate the shift needed to move the char from foundIdx to i
        // In your encrypt logic: swapPos = (i + shift) % m
        // Therefore: shift = foundIdx - i
        let neededShift = foundIdx - i;
        shifts.push(neededShift);

        // Manually perform the swap to keep the simulation in sync
        const idxA = srcMov[i];
        const idxB = srcMov[foundIdx];
        [currentChars[idxA], currentChars[idxB]] = [currentChars[idxB], currentChars[idxA]];
      }

      const cand = shiftsToKeyString(shifts, flagsSuffix);
      return cand;
    }

    // Reverse button: prompt for desired output and try to find a key (systematic numeric search).
    document.getElementById('reverseBtn').addEventListener('click', async () => {
      const source = document.getElementById('wordInput').value;
      if (!source) { alert('Enter source text first.'); return; }
      
      const desired = prompt('Type the exact desired output text:');
      if (!desired) return; 
      
      if (desired.length !== source.length) { 
        alert('Error: Length mismatch! Source is ' + source.length + ' and Target is ' + desired.length); 
        return; 
      }

      const currentKeyRaw = document.getElementById('keyInput').value || '';
      const parsed = parseKeyDetailed(currentKeyRaw);
      const parsedFlags = parsed.flags;
      const startTime = performance.now();

      // Build flags suffix
      let flagsSuffix = '';
      if (parsedFlags.ignoreSpaces) flagsSuffix += '_';
      if (parsedFlags.ignorePunct) flagsSuffix += ':';
      if (parsedFlags.ignorePara) flagsSuffix += '¶';

      let foundKey = null;

      if (settings.reverseMode === 'quick') {
        // Manually integrated Quick Logic to ensure it works
        const srcMov = getMovableIndices(source, parsedFlags);
        const tgtMov = getMovableIndices(desired, parsedFlags);
        
        if (srcMov.length !== tgtMov.length) {
          alert('Error: Movable character count mismatch. Check your flags (_ : ¶)');
          return;
        }

        let currentChars = source.split('');
        let finalChars = desired.split('');
        let shifts = [];

        for (let i = 0; i < srcMov.length; i++) {
          const targetChar = finalChars[srcMov[i]];
          let foundIdx = -1;

          for (let j = i; j < srcMov.length; j++) {
            if (reverseCharsEqual(currentChars[srcMov[j]], targetChar)) {
              foundIdx = j;
              break;
            }
          }

          if (foundIdx === -1) {
            alert('Error: Could not find character "' + targetChar + '" in source. Reversion impossible.');
            return;
          }

          let neededShift = foundIdx - i;
          shifts.push(neededShift);

          // Sync the swap
          const idxA = srcMov[i];
          const idxB = srcMov[foundIdx];
          [currentChars[idxA], currentChars[idxB]] = [currentChars[idxB], currentChars[idxA]];
        }

        // Convert shifts to key string using letters for 10-26, brackets only if >26
        foundKey = shifts.map(formatReverseShift).join('') + flagsSuffix;
        foundKey = normalizeReversedKey(foundKey, true);
      } else {
        // Deep Search: brute-force numeric key search
        const srcMov = getMovableIndices(source, parsedFlags);
        const m = srcMov.length;
        const maxAttempts = 100000;
        const maxKeyLen = Math.min(12, Math.max(1, m));

        for (let len = 1; len <= maxKeyLen && !foundKey; len++) {
          const maxNum = Math.pow(10, len);
          for (let n = 0; n < maxNum && !foundKey; n++) {
            if (len > 1 && n === 0) continue;
            const s = String(n).padStart(len, '0');
            const candKey = s + flagsSuffix;
            const encrypted = encrypt(source, candKey);
            if (settings.caseSensitiveReversion 
              ? encrypted === desired 
              : encrypted.toLowerCase() === desired.toLowerCase()) {
              foundKey = normalizeReversedKey(candKey, false);
            }
          }
        }
      }

      if (foundKey) {
        unlockAchievement('cryptanalyst');
        const elapsedMs = performance.now() - startTime;
        const elapsedSec = elapsedMs / 1000;
        let elapsed;
        if (elapsedSec < 0.0001) {
          elapsed = '<0.0001';
        } else if (elapsedSec < 0.001) {
          elapsed = elapsedSec.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
        } else if (elapsedSec < 0.01) {
          elapsed = elapsedSec.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
        } else {
          elapsed = elapsedSec.toFixed(2);
        }
        document.getElementById('keyInput').value = foundKey;
        document.getElementById('output').textContent = `Compatible key found in ${elapsed}s: ${foundKey}`;
      } else {
        alert('Reversion failed. Try "Deep Search" in settings.');
      }
    });

  </script>
