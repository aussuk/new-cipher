<!DOCTYPE html>
<html lang="en">
<head>
  <link id="favicon" rel="icon" type="image/png" href="logo2.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Cipher Encryptor</title>
  <style>
    /* launcher button and panel drawer */
    .launcherBtn {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 1200;
      background: #2b6cb0;
      color: #fff;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .panelDrawer {
      position: fixed;
      left: 12px;
      top: 48px;
      width: 520px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 72px);
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.25);
      overflow: hidden;
      z-index: 1199;
      display: none;
      flex-direction: column;
    }
    .panelDrawer.show {
      display: flex;
    }
    .panelHeader {
      display:flex;
      align-items:center;
      gap:8px;
      background:#f1f7ff;
      padding:8px 10px;
      border-bottom:1px solid #e6eefc;
    }
    .tabBtn {
      background:transparent;
      border: none;
      padding:6px 10px;
      cursor:pointer;
      border-radius:4px;
      font-weight:600;
    }
    .tabBtn.active { background:#dceffb; }
    .panelClose {
      margin-left:auto;
      background:transparent;
      border: none;
      cursor:pointer;
      font-size:1.0em;
      padding:6px;
    }
    .panelContent {
      padding:10px;
      overflow:auto;
      max-height:calc(100% - 48px);
      background: #fff;
    }
    /* small responsiveness */
    @media (max-width:600px) {
      .panelDrawer { left:8px; top:56px; width: calc(100vw - 16px); }
    }

    body {
      font-family: Arial, sans-serif;
      margin: 5vw;
      background: #f7f7fa;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 6vw;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0001;
    }
    label {
      display: block;
      margin-top: 4vw;
      font-size: 1.1em;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 2vw;
      margin-top: 1vw;
      font-size: 1.1em;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 6px;
      resize: vertical;
      background: #fafafa;
      font-family: 'Inter', 'Poppins', 'Segoe UI', 'Roboto', sans-serif;
    }
    textarea { min-height: 80px; }
    .row { display:flex; align-items:center; gap:10px; margin-top:1.2em; flex-wrap:wrap; }
    button {
      margin-top: 1vw;
      padding: 0.9rem 1.1rem;
      font-size: 1rem;
      background: #4a90e2;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button.secondary { background: #e24a4a; }
    button.ghost {
      background: #444;
      color: #fff;
      border: 1px solid #333;
      padding: 0.7rem 0.9rem;
    }
    .output {
      margin-top: 5vw;
      font-size: 1.2em;
      color: #333;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .statusBar {
      margin-top: 1vw;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95em;
      color: #555;
    }
    .statusBar div {
      min-width: 140px;
    }
    .secret-overlay {
      position: fixed;
      inset: 0;
      z-index: 1300;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      padding: 16px;
    }
    .secret-overlay.hidden {
      display: none;
    }
    .secret-card {
      width: min(460px, 100%);
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .secret-card h3 {
      margin: 0 0 8px;
    }
    .secret-card p {
      margin: 0 0 14px;
      color: #33415b;
    }
    .secret-btn {
      min-width: 80px;
      border-radius: 10px;
      border: none;
      padding: 0.9rem 1rem;
      font-size: 0.98rem;
      cursor: pointer;
      background: #4a90e2;
      color: #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .secret-btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }
    .secret-btn.secondary {
      background: #444;
    }
    .secret-btn:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .note { font-size:0.9em; color:#666; margin-top:6px; }
    @media (max-width: 500px) {
      .container {
        max-width: 98vw;
        padding: 4vw;
      }
      body {
        margin: 2vw;
      }
      label, input[type="text"], button, .output {
        font-size: 1em;
      }
    }
    button:active {
      transform: scale(0.97);
      box-shadow: 0 0 15px rgba(0, 140, 255, 0.4);
      transition: all 0.15s ease;
    }
    button {
      transition: all 0.15s ease;
    }
    .secret-card canvas {
      width: 100%;
      height: auto;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: #111;
      touch-action: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .mobile-snake-controls {
      display: none !important;
    }
    /* Achievements Pop-up Toast */
    .achievement-toast {
      position: fixed;
      top: -100px; /* Start hidden off-screen */
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
      color: #fff;
      padding: 14px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3), 0 0 12px rgba(214, 158, 46, 0.4);
      border: 2px solid #d69e2e; /* Gold border */
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .achievement-toast.show {
      top: 20px; /* Glides down into view */
    }
    .achievement-toast .icon {
      font-size: 24px;
      animation: trophy-bounce 1s infinite alternate;
    }
    .achievement-toast .text-content h4 {
      margin: 0;
      color: #ecc94b; /* Bright Gold */
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .achievement-toast .text-content p {
      margin: 2px 0 0 0;
      font-size: 13px;
      color: #e2e8f0;
    }
    @keyframes trophy-bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }
  </style>
</head>
<body>
  <div class="container">

  <div class="mobile-snake-controls" id="mobileSnakeControls">
    <button class="up" data-dir="up">↑</button>
    <button class="left" data-dir="left">←</button>
    <button class="down" data-dir="down">↓</button>

  </div>

  <div id="secretOverlay" class="secret-overlay hidden">
    <div class="secret-card">
      <h3>Snake mode Activated!</h3>

      <canvas id="snakeCanvas" width="360" height="360" style="background:#111; border-radius:12px; display:block; margin: 0 auto;"></canvas>
      <div id="secretMessage" style="margin-top:12px; font-weight:700; color:#222;">Score: 0</div>
      <div style="margin-top: 18px;">
        <button id="secretCloseBtn" class="secret-btn secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="settingsPanel" class="panelDrawer" role="dialog" aria-modal="true">
    <div class="panelHeader">
      <span>Settings</span>
      <button id="settingsCloseBtn" class="panelClose">✕</button>
    </div>
    <div class="panelContent">
      <label style="display:flex; align-items:center; gap:10px; margin-bottom: 14px;">
        <input type="checkbox" id="caseSensitiveReversion" checked>
        Enable case-sensitive reversion
      </label>

      </label>
      <div style="font-weight:600; margin-bottom: 8px;">Reverse mode</div>
      <label style="display:block; margin-bottom: 12px;">
        <input type="radio" name="reverseMode" value="deep" checked> Deep Search

      </label>
      <label style="display:block; margin-bottom: 12px;">
        <input type="radio" name="reverseMode" value="quick"> Direct Mapping
        <div style="color:#666; margin-left: 22px; font-size:0.95em;">Very fast, but generates a key with a length depending on the input text.</div>
      </label>
    </div>
  </div>

  <div id="achievementsPanel" class="secret-overlay hidden">
    <div class="secret-card" style="max-width: 560px;">
      <h3>Achievements</h3>
      <div id="achievementList" style="display:grid; gap:10px; text-align:left; max-height:60vh; overflow:auto;"></div>
      <div style="margin-top:18px;">
        <button id="achievementsCloseBtn" class="secret-btn secondary">Close</button>
      </div>
    </div>
  </div>

  <div id="developerPanel" class="secret-overlay hidden">
    <div class="secret-card" style="max-width: 520px; background:#151d2d; color:#eef5ff;">
      <h3 style="color:#f7c948;">Developer Mode</h3>
      <div id="developerStats" style="display:grid; gap:10px; text-align:left;"></div>
      <div style="margin-top:18px;">
        <button id="developerCloseBtn" class="secret-btn secondary">Close</button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
    
    // --- 1. FAVICON LOTTERY (1 in 100 Chance) ---
    const favicon = document.getElementById("favicon");
    if (favicon) {
      const faviconRoll = Math.floor(Math.random() * 100); // 0 to 99
      
      if (faviconRoll === 0) {
        // 1% chance to drop the alternate version
        favicon.href = "logo1.png";
      } else if (faviconRoll === 1) {
        // 1% chance to drop the alternate version
        favicon.href = "logo3.png";
      } else {
        // 99% chance for your main standard version
        favicon.href = "logo2.png"; 
      }
    }

    // --- 2. TITLE SPLASH LOTTERY (1 in 1000 Chance) ---
    const titleRoll = Math.floor(Math.random() * 1000); // 0 to 999
    
    if (titleRoll === 0) {
      // Pick randomly between your two specific encrypted string variations
      const secretTitles = [
        "uemocstyppCr hErrti onC", 
        "uroCirCch En tmrtsppeyo"
      ];
      const chosenTitle = secretTitles[Math.floor(Math.random() * secretTitles.length)];
      
      // Update the visual H2 header on the web page
      const headerElement = document.getElementById("mainTitle") || document.querySelector("h2");
      if (headerElement) {
        headerElement.textContent = chosenTitle;
      }
      
      // Update the text display on the actual browser tab
      document.title = chosenTitle;

      // Trigger your achievement pop-up toast notification!
      if (typeof showToast === "function") {
        showToast("🎰 Elite Luck: You hit the 1-in-1000 encrypted title Easter egg!");
      }
    }
    
  });
    // helper: is letter
    function isLetter(ch) {
      return /^[A-Za-z]$/.test(ch);
    }

    // helper: vowel test
    function isVowel(ch) {
      return /[AEIOUaeiou]/.test(ch);
    }

    // evaluate a condition object against a character and optional index (1-based position among movable chars)
    function evaluateSingleCondition(cond, ch, idx) {
      if (!cond) return true;

      // index-based conditions (kind === 'index')
      if (cond.kind === 'index') {
        const i = Number.isFinite(idx) ? idx + 1 : 1;
        let ok = true;

        if (cond.mod != null && cond.op && cond.rhs != null) {
          const val = i % cond.mod;
          ok = (cond.op === '!=') ? (val !== cond.rhs) : (val === cond.rhs);
        } else if (cond.parity) {
          ok = cond.parity === 'even' ? (i % 2 === 0) : (i % 2 !== 0);
        } else if (cond.indices) {
          ok = cond.indices.includes(i);
        } else if (cond.range) {
          ok = i >= cond.range[0] && i <= cond.range[1];
        } else if (cond.op && cond.rhs != null) {
          if (cond.op === '>') ok = i > cond.rhs;
          else if (cond.op === '>=') ok = i >= cond.rhs;
          else if (cond.op === '<') ok = i < cond.rhs;
          else if (cond.op === '<=') ok = i <= cond.rhs;
          else if (cond.op === '==' ) ok = i === cond.rhs;
          else if (cond.op === '!=') ok = i !== cond.rhs;
          else ok = false;
        }

        return cond.negate ? !ok : ok;
      }

      if (!ch) return false;
      const upper = String(ch).toUpperCase();
      if (cond.kind === 'vowel') {
        const res = isVowel(upper);
        return cond.negate ? !res : res;
      } else if (cond.kind === 'consonant') {
        const res = isLetter(upper) && !isVowel(upper);
        return cond.negate ? !res : res;
      } else if (cond.kind === 'equals') {
        if (cond.letters && cond.letters.has(upper)) return cond.negate ? false : true;
        if (cond.ranges) {
          for (const [a,b] of cond.ranges) {
            if (upper >= a && upper <= b) return cond.negate ? false : true;
          }
        }
        return cond.negate ? true : false;
      }
      return true;
    }

    function evaluateCondition(cond, ch, idx) {
      if (!cond) return true;
      const conditions = Array.isArray(cond) ? cond : [cond];
      for (const condition of conditions) {
        if (!evaluateSingleCondition(condition, ch, idx)) return false;
      }
      return true;
    }

    // Replace the current letterToNumber with this safe version
    function letterToNumber(letter) {
      const ch = String(letter || '');
      return /[a-zA-Z]/.test(ch) ? ch.toUpperCase().charCodeAt(0) - 64 : 0;
    }

    // punctuation test with unicode fallback
    function isPunctuation(ch) {
      if (!ch) return false;
      return /[!"#\$%&'\(\)\*\+,\-\.\/:;<=>\?@\[\\\]\^_`{\|}~]/.test(ch)
        || /[\u2000-\u206F\u2E00-\u2E7F]/.test(ch);
    }

    // Build array of indices that are allowed to be moved (respect flags)
    function getMovableIndices(text, flags) {
      flags = flags || {};
      const idx = [];
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (flags.ignorePara && (ch === '\n' || ch === '\r')) continue;
        if (flags.ignoreSpaces && /\s/.test(ch)) continue;
        if (flags.ignorePunct && isPunctuation(ch)) continue;
        idx.push(i);
      }
      return idx;
    }

    function formatPrimitiveValue(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return '';
      if (num >= 0 && num <= 9) return String(num);
      return `(${num})`;
    }

    function findMatchingDelimiter(text, startIndex, closeChar) {
      let depth = 0;
      for (let i = startIndex; i < text.length; i++) {
        const ch = text[i];
        if (ch === '[' || ch === '(') depth++;
        if (ch === closeChar) {
          depth--;
          if (depth === 0) return i;
        }
        if (ch === ']' || ch === ')') {
          if (depth <= 0) return i;
        }
      }
      return -1;
    }

    function readConditionalToken(text, startIndex) {
      const ch = text[startIndex];
      if (ch !== '?' && ch !== '!') return null;
      const next = text[startIndex + 1] || '';
      if (next === '=') {
        let j = startIndex + 2;
        while (j < text.length && /[A-Za-z\-,]/.test(text[j])) j++;
        return { token: text.slice(startIndex, j), nextIndex: j - 1 };
      }
      if (next === '(') {
        const end = findMatchingDelimiter(text, startIndex + 1, ')');
        if (end !== -1) {
          return { token: text.slice(startIndex, end + 1), nextIndex: end };
        }
      }
      if (/^[VCvc]$/.test(next)) {
        return { token: text.slice(startIndex, startIndex + 2), nextIndex: startIndex + 1 };
      }
      if (next && next.toLowerCase() === 'i') {
        let j = startIndex + 2;
        if (j < text.length && /^[eo]$/i.test(text[j])) {
          return { token: text.slice(startIndex, j + 1), nextIndex: j };
        }
        if (j < text.length && text[j] === '(') {
          const end = findMatchingDelimiter(text, j, ')');
          if (end !== -1) {
            return { token: text.slice(startIndex, end + 1), nextIndex: end };
          }
        }
        return { token: text.slice(startIndex, startIndex + 2), nextIndex: startIndex + 1 };
      }
      return { token: text.slice(startIndex, startIndex + 1), nextIndex: startIndex };
    }

    function readSignedNumberToken(text, startIndex) {
      const ch = text[startIndex] || '';
      let j = startIndex;
      let sign = '';
      if (ch === '-') {
        sign = '-';
        j += 1;
      }
      if (j >= text.length || !/\d/.test(text[j])) return null;
      if (!sign) {
        return { value: Number(text[j]), endIndex: j };
      }
      while (j < text.length && /\d/.test(text[j])) j += 1;
      return { value: Number(sign + text.slice(startIndex + sign.length, j)), endIndex: j - 1 };
    }

    function compileKeyToPrimitive(rawKey) {
      const raw = String(rawKey || '');
      if (!raw) return { compiledKey: '', length: 0 };

      const flagsSuffix = raw.match(/[_:¶]+$/)?.[0] || '';
      const hasExtender = /-$/.test(raw.replace(/[_:¶]/g, '').replace(/#\d+/g, ''));
      const keyWorking = raw.replace(/[_:¶]/g, '').replace(/#\d+/g, '').replace(/-$/, '');
      const parts = [];
      let pendingCond = '';
      let extenderRepeatPattern = '';

      function appendToken(token, cond = '') {
        if (!token) return;
        const prefix = cond || pendingCond;
        const emitted = prefix ? prefix + token : token;
        if (prefix) {
          parts.push(emitted);
        } else {
          parts.push(token);
        }
        extenderRepeatPattern = emitted;
        pendingCond = '';
      }

      function emitExpandedGroup(body, condPrefix = '') {
        const items = body.split(',').map(s => s.trim()).filter(Boolean);
        const out = [];
        for (const item of items) {
          const token = compileKeyToken(item);
          if (!token) continue;
          const prefix = condPrefix || '';
          out.push(prefix ? prefix + token : token);
        }
        return out;
      }

      for (let i = 0; i < keyWorking.length; i++) {
        const ch = keyWorking[i];
        if (ch === '?' || ch === '!') {
          const parsed = readConditionalToken(keyWorking, i);
          if (parsed) {
            pendingCond = parsed.token;
            i = parsed.nextIndex;
            continue;
          }
        }

        const signedNumber = readSignedNumberToken(keyWorking, i);
        if (signedNumber) {
          appendToken(formatPrimitiveValue(signedNumber.value));
          i = signedNumber.endIndex;
          continue;
        }

        if (ch === '[') {
          const end = findMatchingDelimiter(keyWorking, i, ']');
          if (end !== -1) {
            const body = keyWorking.slice(i + 1, end);
            const expanded = emitExpandedGroup(body, pendingCond);
            expanded.forEach(token => parts.push(token));
            extenderRepeatPattern = expanded.join('');
            pendingCond = '';
            i = end;
            continue;
          }
        }

        if (ch === '(') {
          const end = findMatchingDelimiter(keyWorking, i, ')');
          if (end !== -1) {
            const inner = keyWorking.slice(i + 1, end).trim();
            if (/^-?\d+$/.test(inner)) {
              appendToken(formatPrimitiveValue(Number(inner)));
              i = end;
              continue;
            }
            if (inner.includes(',')) {
              const expanded = emitExpandedGroup(inner, pendingCond);
              expanded.forEach(token => appendToken(token, ''));
              extenderRepeatPattern = expanded[expanded.length - 1] || extenderRepeatPattern;
              pendingCond = '';
              i = end;
              continue;
            }
          }
        }

        if (/[A-Za-z]/.test(ch)) {
          appendToken(formatPrimitiveValue(letterToNumber(ch)));
          continue;
        }
      }

      const compiledRaw = parts.join('');
      const compacted = compactCompiledKey(compiledRaw, { hasExtender, extenderRepeatPattern });
      const compiledWithFlags = compacted + flagsSuffix;
      const length = hasExtender ? '∞' : compiledWithFlags.length;
      return { compiledKey: compiledWithFlags, length, expandedKey: compiledRaw + flagsSuffix };
    }

    function compileKeyToken(token) {
      const trimmed = String(token || '').trim();
      if (!trimmed) return '';
      if (/^\d+$/.test(trimmed)) {
        return formatPrimitiveValue(Number(trimmed));
      }
      if (/^-\d+$/.test(trimmed)) {

        if (repeatTail) {

      const repeatPattern = detectRepeatPattern(compiledKey);

        let built = pattern;
        while (built.length < text.length) {

    //   and negated versions !v, !c, !=a,b, !=a-c, !i(>n)
    // Returns { numbers[], ops:[{shift,cond|null}], flags:{...}, repeat }
    function parseKeyDetailed(rawKey) {

      if (!rawKey) return { numbers: [], ops: [], flags, repeat: 1 };

      // remove repeat tokens FIRST
      keyWorking = keyWorking.replace(/#\d+/g, '');

      let extender = false;

      // everything below should use keyWorking
      const keyNoRepeat = keyWorking;

      if (keyNoRepeat.includes('_')) flags.ignoreSpaces = true;

      const numbers = [];
      const ops = [];
      const pendingConds = [];
      let extenderCycleStart = null;
      let extenderCycleLen = 0;
      let lastParsedGroupStart = null;
      let lastParsedGroupLen = 0;

      function pushShift(val, conds = null) {

      function rememberLastGroup(startIndex, count) {

            extenderCycleLen = cycleLen;

            extenderCycleLen = lastParsedGroupLen;

        for (const item of items) {

        if ((a.op || null) !== (b.op || null)) return false;

        if ((a.parity || null) !== (b.parity || null)) return false;
        if (a.range || b.range) {

        }

          const B = Array.from(b.letters).sort();

          for (let i = 0; i < A.length; i++) if (A[i] !== B[i]) return false;
        }

          if (!a.ranges || !b.ranges) return false;
          if (a.ranges.length !== b.ranges.length) return false;
          for (let i = 0; i < a.ranges.length; i++) {

          }

      function opEquals(x, y) {

          } else {

        }

            i--;
            const items = list.split(',').map(s => s.trim()).filter(Boolean);
            const letters = new Set();
            const ranges = [];
            for (let it of items) {

                continue;
              }

        if (ch === '[' || ch === '(') {

          const parsedGroup = parseBracketList(i, ch, closeChar);
          if (parsedGroup.values.length) {

            }

            i = parsedGroup.nextIndex;
          }

          continue;
        }

        if (/[a-zA-Z]/.test(ch)) {

          rememberLastGroup(ops.length - 1, 1);

    // Decryption: reverse the process by iterating movable positions in reverse order

        const m = movable.length;
        if (m === 0) break;

        const baseLen = ops.length || 1;

        function getOpFor(rnd, i, linearIdx) {
          if (!parsed.extender) return ops[i % ops.length];
          const cycleStart = Number.isInteger(parsed.extenderCycleStart) ? parsed.extenderCycleStart : baseLen - 1;

          if (!evaluateCondition(op.cond, curLetter, i)) continue;
          [chars[idxA], chars[idxB]] = [chars[idxB], chars[idxA]];

          settings.liveEncrypt = parsed.liveEncrypt;
          document.getElementById('liveEncrypt').checked = parsed.liveEncrypt;
        }
        if (typeof parsed.enableStatsPanel === 'boolean') {
          settings.enableStatsPanel = parsed.enableStatsPanel;
          document.getElementById('enableStatsPanel').checked = parsed.enableStatsPanel;
        }
        if (parsed.reverseMode === 'deep' || parsed.reverseMode === 'quick') {
          settings.reverseMode = parsed.reverseMode;
          const selected = document.querySelector(`input[name="reverseMode"][value="${parsed.reverseMode}"]`);
          if (selected) selected.checked = true;
        }
      } catch (err) {
        console.warn('Failed to load settings:', err);
      }

    // Load achievements from localStorage on boot
    function loadAchievements() {
      try {
        const saved = localStorage.getItem(ACHIEVEMENTS_KEY);
        if (!saved) return;
        const parsed = JSON.parse(saved);
        // Sync values into our operational object
        for (let key in parsed) {
          if (achievements[key]) {
            achievements[key].unlocked = parsed[key].unlocked;
          }
        }
      } catch (err) {
        console.warn('Failed to load achievements:', err);
      }

    function checkKeyAchievements(rawKey) {
      const parsed = parseKeyDetailed(rawKey || '');
      if (/[?!]/.test(rawKey || '')) {
        unlockAchievement('bigBrain');
      }
      if (parsed.extender) {
        unlockAchievement('infinity');
      }
      const clean = (rawKey || '').toLowerCase().trim();
      if (clean === '67' || clean === 'sixseven') {
        unlockAchievement('doomedSociety');
      }
    }

    // Trigger an unlock check
    function unlockAchievement(id) {
      if (achievements[id] && !achievements[id].unlocked) {
        achievements[id].unlocked = true;
        
        // Save state immediately
        localStorage.setItem(ACHIEVEMENTS_KEY, JSON.stringify(achievements));
        
        // Throw the top screen animation popup
        showAchievementToast(achievements[id].name, achievements[id].desc);
      }
    }

    // Creates and animates the toast container at the top of the viewport
    function showAchievementToast(title, description) {
      // Remove an old toast if one is still lingering
      const oldToast = document.querySelector('.achievement-toast');
      if (oldToast) oldToast.remove();

      // Build the structure
      const toast = document.createElement('div');
      toast.className = 'achievement-toast';
      toast.innerHTML = `
        <div class="icon">🏆</div>
        <div class="text-content">
          <h4>Achievement Unlocked!</h4>
          <p><strong>${title}</strong> - ${description}</p>
        </div>
      `;
      document.body.appendChild(toast);

      // Trigger transition via macro-task delay
      setTimeout(() => toast.classList.add('show'), 50);

      // Slide back up and delete after 4 seconds
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 600);
      }, 4000);
    }

    function getPresetMap() {
      return presets && typeof presets === 'object' ? presets : {};
    }

    function savePresetMap(map) {
      presets = map;
      localStorage.setItem(PRESETS_KEY, JSON.stringify(map));
      updatePresetPicker();

    function saveCurrentPreset() {
      const key = document.getElementById('keyInput').value.trim();
      if (!key) {
        alert('Type a key before saving a preset.');
        return;
      }
      const presetName = prompt('Name this preset:');
      if (!presetName) return;
      const safeName = presetName.trim().replace(/^@/, '').replace(/\s+/g, '_');
      if (!safeName) return;
      const map = getPresetMap();
      map[safeName] = key;
      savePresetMap(map);
      unlockAchievement('presetPioneer');
    }

    function normalizePresetName(raw) {
      const text = String(raw || '').trim().replace(/^@/, '');
      return text.replace(/\s+/g, '_');
    }

    function runPresetCommand(raw) {
      const text = raw.trim();
      if (!text.startsWith('/')) return false;

      const parts = text.split(/\s+/);
      const command = parts[0].toLowerCase();
      const arg = parts.slice(1).join(' ').trim();
      const map = getPresetMap();
      const subcommand = (parts[1] || '').toLowerCase();

      if (command === '/help' || command === '/commands') {
        document.getElementById('output').textContent = `Commands:
        /preset save <presetname> <key>
        /preset load <presetname>
        /preset delete <presetname>
        /preset list`;
        return true;
      }

      if (command === '/preset' && subcommand === 'list') {
        const names = Object.keys(map).sort();
        document.getElementById('output').textContent = names.length
          ? `Presets: ${names.map(n => '@' + n).join(', ')}`
          : 'No presets saved yet.';
        return true;
      }

      if (command === '/preset' && subcommand === 'save') {
          if (parts.length < 4) {
              document.getElementById('output').textContent =
                  'Usage: /preset save <presetname> <key>';
              return true;
          }
      
          const name = normalizePresetName(parts[2]);
          const key = parts.slice(3).join(' ').trim();
      
          if (!name || !key) {
              document.getElementById('output').textContent =
                  'Usage: /preset save <presetname> <key>';
              return true;
          }
      
          map[name] = key;
          savePresetMap(map);
          unlockAchievement('presetPioneer');
      
          document.getElementById('keyInput').value = '';
          document.getElementById('output').textContent =
              `Preset saved as @${name}`;
      
          return true;
      }
      
      if (command === '/preset' && subcommand === 'load') {
        const name = normalizePresetName(parts[2]);
        if (!name) {
          document.getElementById('output').textContent = 'Usage: /preset load <presetname>';
          return true;
        }
        const presetValue = loadPresetByName(name);
        if (presetValue === null) {
          document.getElementById('output').textContent = `Preset @${name} not found.`;
          return true;
        }
        document.getElementById('keyInput').value = presetValue;
        document.getElementById('output').textContent = `Loaded preset @${name}`;
        return true;
      }

      if (command === '/preset' && subcommand === 'delete') {
          if (parts.length < 3) {
              document.getElementById('output').textContent =
                  'Usage: /preset delete <presetname>';
              return true;
          }
      
          const name = normalizePresetName(parts[2]);
        if (!name) {
          document.getElementById('output').textContent = 'Usage: /preset delete <presetname>';
          return true;
        }
        if (!Object.prototype.hasOwnProperty.call(map, name) || map[name] === undefined || map[name] === null) {
          document.getElementById('output').textContent = `Preset @${name} not found.`;
          return true;
        }
        delete map[name];
        savePresetMap(map);
        document.getElementById('keyInput').value = '';
        document.getElementById('output').textContent = `Deleted preset @${name}`;
        return true;
      }

      document.getElementById('output').textContent = 'Unknown command. Try /help.';
      return true;
    }

    function updatePresetPicker() {
      const picker = document.getElementById('presetPicker');
      const buttons = document.getElementById('presetButtons');
      if (!picker || !buttons) return;
      const map = getPresetMap();
      const names = Object.keys(map)
        .filter(name => typeof name === 'string' && name.length > 0 && name !== 'undefined')
        .filter(name => map[name] !== undefined && map[name] !== null && map[name] !== '')
        .sort();
      if (!names.length) {
        picker.style.display = 'none';
        buttons.innerHTML = '';
        return;
      }
      picker.style.display = 'block';
      buttons.innerHTML = '';
      names.forEach(name => {
        const value = map[name];
        if (value === undefined || value === null || value === '') return;
        const btn = document.createElement('button');
        btn.className = 'ghost';
        btn.textContent = `@${name}`;
        btn.style.padding = '0.45rem 0.65rem';
        btn.style.fontSize = '0.9rem';
        btn.addEventListener('click', () => {
          const keyInput = document.getElementById('keyInput');
          const presetValue = loadPresetByName(name);
          if (presetValue === null) return;
          keyInput.value = presetValue;
          checkKeyAchievements(keyInput.value);
          handleLiveInputUpdate();
        });
        buttons.appendChild(btn);
      });
    }

    function loadPresetByName(name) {
      const safeName = normalizePresetName(name);
      if (!safeName) return null;
      const map = getPresetMap();
      if (!Object.prototype.hasOwnProperty.call(map, safeName)) return null;
      const value = map[safeName];
      return (value === undefined || value === null || value === '') ? null : value;
    }

      const word = document.getElementById('wordInput').value || '';

      const movable = getMovableIndices(word, parsed.flags);
      const movableCount = movable.length;
      const outputText = getOutputText();
      let changedCount = 0;
      for (const idx of movable) {
        if (outputText[idx] !== word[idx]) changedCount += 1;
      }
      const aura = movableCount ? Math.min(100, Math.round((changedCount / movableCount) * 100)) : 0;
      const bananaIndex = (key.length + (parsed.ops.length || 0) + (movableCount || 0)) / Math.max(1, word.length || 1);
      const weirdness = (key.includes('?') || key.includes('!') || key.includes('-') || key.includes('#'))
        ? 'Extreme'
        : (parsed.ops.length > 3 ? 'High' : 'Moderate');
      const chaosPotential = aura >= 100 ? 'Maximum' : aura >= 70 ? 'High' : aura >= 35 ? 'Medium' : 'Low';
      const stats = [

        ['Key Weirdness', weirdness],
        ['Chaos Potential', chaosPotential],
        ['Rounds', String(Math.max(1, parsed.repeat || 1))],
        ['Preset Count', String(Object.keys(getPresetMap()).length)]

      container.innerHTML = '';

    function initSnakeGame() {
      snakeCanvas = document.getElementById('snakeCanvas');
      snakeCtx = snakeCanvas.getContext('2d');
      snakeBody = [
        { x: 8, y: 9 },
        { x: 7, y: 9 },
        { x: 6, y: 9 }
      ];
      snakeDirection = 'right';
      snakeNextDirection = 'right';
      snakeScore = 0;
      snakeRunning = true;
      placeSnakeFood();
      resizeSnakeCanvas();
      drawSnakeGame();
      if (snakeInterval) clearInterval(snakeInterval);
      snakeInterval = setInterval(tickSnakeGame, 140);
    }

    function resizeSnakeCanvas() {
      if (!snakeCanvas) return;
      const rect = snakeCanvas.getBoundingClientRect();
      const size = Math.min(rect.width, window.innerHeight * 0.72, 420);
      const dpr = window.devicePixelRatio || 1;
      snakeCanvas.style.width = `${size}px`;
      snakeCanvas.style.height = `${size}px`;
      snakeCanvas.width = Math.floor(size * dpr);
      snakeCanvas.height = Math.floor(size * dpr);
      snakeCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      snakeCellSize = size / snakeGridSize;
    }

    function setupSnakeGestureControls() {
      if (!snakeCanvas) return;
      snakeCanvas.addEventListener('pointerdown', (e) => {
        snakePointerActive = true;
        snakePointerId = e.pointerId;
        snakePointerStart = { x: e.clientX, y: e.clientY };
        snakeCanvas.setPointerCapture(e.pointerId);
      });
      snakeCanvas.addEventListener('pointerup', (e) => {
        if (!snakePointerActive || e.pointerId !== snakePointerId || !snakePointerStart) return;
        const dx = e.clientX - snakePointerStart.x;
        const dy = e.clientY - snakePointerStart.y;
        snakePointerActive = false;
        snakePointerId = null;
        snakePointerStart = null;
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        if (dist < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          handleSnakeDirection(dx > 0 ? 'right' : 'left');
        } else {
          handleSnakeDirection(dy > 0 ? 'down' : 'up');
        }
      });
      snakeCanvas.addEventListener('pointercancel', () => {
        snakePointerActive = false;
        snakePointerId = null;
        snakePointerStart = null;
      });
    }

    function stopSnakeGame() {
      snakeRunning = false;
      if (snakeInterval) {
        clearInterval(snakeInterval);
        snakeInterval = null;
      }
    }

    function placeSnakeFood() {
      const occupied = new Set(snakeBody.map(p => `${p.x},${p.y}`));
      let x, y;
      do {
        x = Math.floor(Math.random() * snakeGridSize);
        y = Math.floor(Math.random() * snakeGridSize);
      } while (occupied.has(`${x},${y}`));
      snakeFood = { x, y };
    }

    function tickSnakeGame() {
      if (snakeScore === 20) {
        unlockAchievement('snakeMaster');
      }
      if (!snakeRunning) return;
      snakeDirection = snakeNextDirection;
      const head = { ...snakeBody[0] };
      if (snakeDirection === 'up') head.y -= 1;
      else if (snakeDirection === 'down') head.y += 1;
      else if (snakeDirection === 'left') head.x -= 1;
      else if (snakeDirection === 'right') head.x += 1;

      if (head.x < 0 || head.x >= snakeGridSize || head.y < 0 || head.y >= snakeGridSize) {
        endSnakeGame();
        return;
      }

      if (snakeBody.some(segment => segment.x === head.x && segment.y === head.y)) {
        endSnakeGame();
        return;
      }

      snakeBody.unshift(head);
      if (head.x === snakeFood.x && head.y === snakeFood.y) {
        snakeScore += 1;
        placeSnakeFood();
      } else {
        snakeBody.pop();
      }
      drawSnakeGame();
      document.getElementById('secretMessage').textContent = `Score: ${snakeScore}`;
    }

    function endSnakeGame() {
      snakeRunning = false;
      if (snakeInterval) {
        clearInterval(snakeInterval);
        snakeInterval = null;
      }
      document.getElementById('secretMessage').textContent = `Game Over — score ${snakeScore}. Close to exit.`;
      drawSnakeGame(true);
    }

    function drawSnakeGame(gameOver = false) {
      snakeCtx.fillStyle = '#111';
      snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
      snakeCtx.strokeStyle = '#222';
      snakeCtx.lineWidth = 2;
      for (let x = 0; x <= snakeGridSize; x += 1) {
        snakeCtx.beginPath();
        snakeCtx.moveTo(x * snakeCellSize, 0);
        snakeCtx.lineTo(x * snakeCellSize, snakeGridSize * snakeCellSize);
        snakeCtx.stroke();
      }
      for (let y = 0; y <= snakeGridSize; y += 1) {
        snakeCtx.beginPath();
        snakeCtx.moveTo(0, y * snakeCellSize);
        snakeCtx.lineTo(snakeGridSize * snakeCellSize, y * snakeCellSize);
        snakeCtx.stroke();
      }
      snakeCtx.fillStyle = '#ff3b3b';
      snakeCtx.fillRect(snakeFood.x * snakeCellSize + 2, snakeFood.y * snakeCellSize + 2, snakeCellSize - 4, snakeCellSize - 4);
      snakeCtx.fillStyle = gameOver ? '#aaa' : '#6ee76e';
      snakeBody.forEach((segment, index) => {
        const inset = index === 0 ? 0 : 3;
        snakeCtx.fillRect(segment.x * snakeCellSize + inset, segment.y * snakeCellSize + inset, snakeCellSize - inset * 2, snakeCellSize - inset * 2);
      });
    }

    function handleSnakeDirection(direction) {
      if (!snakeOverlayOpen || !snakeRunning) return;
      const opposite = {
        up: 'down',
        down: 'up',
        left: 'right',
        right: 'left'
      };
      if (direction === opposite[snakeDirection]) return;
      if (['up','down','left','right'].includes(direction)) {
        snakeNextDirection = direction;
      }
    }

    function registerSecretInput(direction) {
      if (snakeOverlayOpen) return;
      if (direction === konamiPattern[konamiProgress]) {
        konamiProgress += 1;
        if (konamiProgress === konamiPattern.length) {
          showSecretOverlay();
          konamiProgress = 0;
        }
      } else {
        konamiProgress = direction === konamiPattern[0] ? 1 : 0;
      }
    }

    document.addEventListener('keydown', function(e) {
      const arrowDirection = e.key.startsWith('Arrow') ? e.key.replace('Arrow', '').toLowerCase() : null;
      const wasdMap = { w: 'up', a: 'left', s: 'down', d: 'right' };
      const wasdDirection = wasdMap[e.key.toLowerCase()] || null;
      const direction = arrowDirection || wasdDirection;

      if (snakeOverlayOpen && direction) {
        handleSnakeDirection(direction);
        e.preventDefault();
        return;
      }

      if (arrowDirection && !snakeOverlayOpen) {
        registerSecretInput(arrowDirection);
      }
    });

    // Touch swipe detection for Konami activation

    }, false);

    document.addEventListener('touchend', (e) => {
      if (snakeOverlayOpen) return;
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      const threshold = 50;

      let direction = null;
      if (Math.abs(diffY) > Math.abs(diffX)) {
        direction = diffY < -threshold ? 'up' : diffY > threshold ? 'down' : null;
      } else {
        direction = diffX < -threshold ? 'left' : diffX > threshold ? 'right' : null;
      }

      if (direction) {
        registerSecretInput(direction);
      }
    }, false);

    // Random Key Generator
    function generateRandomKey(min = 2, max = 15) {
      const len = Math.floor(Math.random() * (max - min + 1)) + min;
      let parts = [];

      function randomShiftToken(withGroup = false) {
        const roll = Math.random();
        if (roll < 0.16) {
          return String.fromCharCode(65 + Math.floor(Math.random() * 26));
        }
        if (roll < 0.32) {
          return String(Math.floor(Math.random() * 10));
        }
        if (roll < 0.48) {
          const value = String(Math.floor(Math.random() * 90) + 10);
          return value;
        }
        if (roll < 0.64) {
          const value = String(Math.floor(Math.random() * 90) + 10);
          return '(' + value + ')';
        }
        return String(Math.floor(Math.random() * 90) + 10);
      }

      function randomGroupToken() {
        const count = Math.floor(Math.random() * 3) + 2;
        const items = [];
        for (let i = 0; i < count; i++) {
          const itemRoll = Math.random();
          if (itemRoll < 0.3) {
            items.push(String(Math.floor(Math.random() * 10)));
          } else if (itemRoll < 0.8) {
            items.push(String(Math.floor(Math.random() * 90) + 10));
          } else {
            items.push(String.fromCharCode(65 + Math.floor(Math.random() * 26)));
          }
        }
        return '[' + items.join(',') + ']';
      }

      for (let i = 0; i < len; i++) {
        parts.push(randomShiftToken(false));
      }

      // helper to build a conditional token
      function randomConditional() {
        const neg = Math.random() < 0.25; // 25% chance negative
        const prefix = neg ? '!' : '?';

        const kindRoll = Math.random();
        if (kindRoll < 0.18) {
          // vowel/consonant
          return prefix + (Math.random() < 0.5 ? 'V' : 'C');
        } else if (kindRoll < 0.55) {
          // single or multi-letter list like a or a,b,c
          const count = Math.floor(Math.random() * 3) + 1; // 1..3
          const chosen = new Set();
          while (chosen.size < count) {
            const ch = String.fromCharCode(65 + Math.floor(Math.random() * 26));
            chosen.add(ch);
          }
          return prefix + '=' + Array.from(chosen).map(c => c.toLowerCase()).join(',');
        } else {
          const count = Math.floor(Math.random() * 3) + 2;
          const chosen = new Set();
          while (chosen.size < count) {
            const ch = String.fromCharCode(65 + Math.floor(Math.random() * 26));
            chosen.add(ch);
          }
          return prefix + '=' + Array.from(chosen).map(c => c.toLowerCase()).join(',');
        }
      }

      function isConditionalToken(token) {
        return typeof token === 'string' && (/^\?/.test(token) || /^!/.test(token));
      }

      // randomly insert 0..2 conditionals into the parts array (ensure each conditional precedes a shift token)
      const condCount = Math.random() < 0.45 ? (Math.random() < 0.2 ? 2 : 1) : 0; // ~45% chance to add cond(s)
      for (let c = 0; c < condCount; c++) {
        const token = randomConditional();

        // find indices of real shift tokens to insert BEFORE them
        const candidatePositions = [];
        for (let i = 0; i < parts.length; i++) {
          const p = parts[i];
          if (!isConditionalToken(p)) candidatePositions.push(i);
        }

        if (candidatePositions.length === 0) break; // nothing valid to attach to

        const pos = candidatePositions[Math.floor(Math.random() * candidatePositions.length)];
        parts.splice(pos, 0, token);
      }

      for (let i = 0; i < parts.length - 1; i++) {
        if (isConditionalToken(parts[i]) && !isConditionalToken(parts[i + 1]) && Math.random() < 0.35) {
          parts[i + 1] = randomGroupToken();
          i++;
        }
      }

      if (!parts.some(part => /^\[/.test(part)) && Math.random() < 0.18) {
        parts.push(randomGroupToken());
        parts.push('-');
      }

      let k = parts.join('');
      const hasGroup = /\[[^\]]+\]/.test(k);
      if (hasGroup && /\[[^\]]+\]$/.test(k) && Math.random() < 0.35) {
        k = k + '-';
      } else if (!hasGroup && Math.random() < 0.25) {
        const value = String(Math.floor(Math.random() * 90) + 10);
        k = k + value;
      }

      // small chance to append flags as before
      const r = Math.random();
      if (r < 0.12) k += '_';
      else if (r < 0.24) k += ':';
      else if (r < 0.36) k += '¶';

      return k;
    }

    document.getElementById('randomKeyBtn').addEventListener('click', () => {
      const k = generateRandomKey(2, 15);
      const keyInput = document.getElementById('keyInput');
      keyInput.value = k;
      checkKeyAchievements(k);

    // Copy output (copies only the transformed text, without "Encrypted:"/ "Decrypted:")
    async function copyOutput() {
      const text = getCopyableOutputText();
      if (!text) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        const btn = document.getElementById('copyBtn');
        const old = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = old, 1000);
      } catch (err) {
        console.error('Copy failed', err);
      }
    }

    document.getElementById('liveEncrypt').addEventListener('change', syncSettingsFromUi);

    // Boot Up Sequence: Load from storage first, update variables, then draw metrics safely
    loadAchievements();

    function normalizeForReverse(text) {
      return settings.caseSensitiveReversion ? text : String(text).toLowerCase();
    }

    function reverseCharsEqual(a, b) {
      return settings.caseSensitiveReversion ? a === b : String(a).toLowerCase() === String(b).toLowerCase();
    }

    function tryQuickReverse(source, desired, parsedFlags, flagsSuffix) {
      const srcMov = getMovableIndices(source, parsedFlags);
      const tgtMov = getMovableIndices(desired, parsedFlags);
      const m = srcMov.length;
      
      let currentChars = source.split('');
      let finalChars = desired.split('');
      let shifts = [];

      for (let i = 0; i < m; i++) {
        const targetChar = finalChars[srcMov[i]]; // What SHOULD be at this position
        
        // Find where that character is currently located in our working array
        let foundIdx = -1;
        for (let j = i; j < m; j++) {
          if (reverseCharsEqual(currentChars[srcMov[j]], targetChar)) {
            foundIdx = j;
            break;
          }
        }

        if (foundIdx === -1) return null; // Character mismatch

        // Calculate the shift needed to move the char from foundIdx to i
        // In your encrypt logic: swapPos = (i + shift) % m
        // Therefore: shift = foundIdx - i
        let neededShift = foundIdx - i;
        shifts.push(neededShift);

        // Manually perform the swap to keep the simulation in sync
        const idxA = srcMov[i];
        const idxB = srcMov[foundIdx];
        [currentChars[idxA], currentChars[idxB]] = [currentChars[idxB], currentChars[idxA]];
      }

      const cand = shiftsToKeyString(shifts, flagsSuffix);
      return cand;
    }

    // Reverse button: prompt for desired output and try to find a key (systematic numeric search).
    document.getElementById('reverseBtn').addEventListener('click', async () => {
      const source = document.getElementById('wordInput').value;
      if (!source) { alert('Enter source text first.'); return; }
      
      const desired = prompt('Type the exact desired output text:');
      if (!desired) return; 
      
      if (desired.length !== source.length) { 
        alert('Error: Length mismatch! Source is ' + source.length + ' and Target is ' + desired.length); 
        return; 
      }

      const currentKeyRaw = document.getElementById('keyInput').value || '';
      const parsed = parseKeyDetailed(currentKeyRaw);
      const parsedFlags = parsed.flags;
      const startTime = performance.now();

      // Build flags suffix
      let flagsSuffix = '';
      if (parsedFlags.ignoreSpaces) flagsSuffix += '_';
      if (parsedFlags.ignorePunct) flagsSuffix += ':';
      if (parsedFlags.ignorePara) flagsSuffix += '¶';

      let foundKey = null;

      if (settings.reverseMode === 'quick') {
        // Manually integrated Quick Logic to ensure it works
        const srcMov = getMovableIndices(source, parsedFlags);
        const tgtMov = getMovableIndices(desired, parsedFlags);
        
        if (srcMov.length !== tgtMov.length) {
          alert('Error: Movable character count mismatch. Check your flags (_ : ¶)');
          return;
        }

        let currentChars = source.split('');
        let finalChars = desired.split('');
        let shifts = [];

        for (let i = 0; i < srcMov.length; i++) {
          const targetChar = finalChars[srcMov[i]];
          let foundIdx = -1;

          for (let j = i; j < srcMov.length; j++) {
            if (reverseCharsEqual(currentChars[srcMov[j]], targetChar)) {
              foundIdx = j;
              break;
            }
          }

          if (foundIdx === -1) {
            alert('Error: Could not find character "' + targetChar + '" in source. Reversion impossible.');
            return;
          }

          let neededShift = foundIdx - i;
          shifts.push(neededShift);

          // Sync the swap
          const idxA = srcMov[i];
          const idxB = srcMov[foundIdx];
          [currentChars[idxA], currentChars[idxB]] = [currentChars[idxB], currentChars[idxA]];
        }

        // Convert shifts to key string using letters for 10-26, brackets only if >26
        foundKey = shifts.map(formatReverseShift).join('') + flagsSuffix;
        foundKey = normalizeReversedKey(foundKey, true);
      } else {
        // Deep Search: brute-force numeric key search
        const srcMov = getMovableIndices(source, parsedFlags);
        const m = srcMov.length;
        const maxAttempts = 100000;
        const maxKeyLen = Math.min(12, Math.max(1, m));

        for (let len = 1; len <= maxKeyLen && !foundKey; len++) {
          const maxNum = Math.pow(10, len);
          for (let n = 0; n < maxNum && !foundKey; n++) {
            if (len > 1 && n === 0) continue;
            const s = String(n).padStart(len, '0');
            const candKey = s + flagsSuffix;
            const encrypted = encrypt(source, candKey);
            if (settings.caseSensitiveReversion 
              ? encrypted === desired 
              : encrypted.toLowerCase() === desired.toLowerCase()) {
              foundKey = normalizeReversedKey(candKey, false);
            }
          }
        }
      }

      if (foundKey) {
        unlockAchievement('reverseWizard');
        const elapsedMs = performance.now() - startTime;
        const elapsedSec = elapsedMs / 1000;
        let elapsed;
        if (elapsedSec < 0.0001) {
          elapsed = '<0.0001';
        } else if (elapsedSec < 0.001) {
          elapsed = elapsedSec.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
        } else if (elapsedSec < 0.01) {
          elapsed = elapsedSec.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
        } else {
          elapsed = elapsedSec.toFixed(2);
        }
        document.getElementById('keyInput').value = foundKey;
        document.getElementById('output').textContent = `Compatible key found in ${elapsed}s: ${foundKey}`;
      } else {
        alert('Reversion failed. Try "Deep Search" in settings.');
      }
    });
